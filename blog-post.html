<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Article — Lucera Global</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f0f4f0;--bg-dark:#1a2e1a;--green:#2d6a4f;--green-mid:#40916c;--green-light:#74c69d;--text:#1a2e1a;--text-mid:#4a5e4a;--muted:#7a907a;--border:rgba(45,106,79,0.15)}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text)}
.display{font-family:'Playfair Display',serif}
nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:1.1rem 4rem;display:flex;align-items:center;justify-content:space-between;background:rgba(240,244,240,0.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.nav-logo{font-family:'Playfair Display',serif;font-size:1.35rem;font-weight:500;letter-spacing:0.06em;color:var(--text);text-decoration:none}
.nav-links{display:flex;gap:2.5rem;list-style:none}
.nav-links a{font-size:0.78rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);text-decoration:none;transition:color 0.2s}
.nav-links a:hover{color:var(--green)}
.btn-whatsapp{display:flex;align-items:center;gap:0.5rem;background:#25D366;color:white;padding:0.6rem 1.25rem;border-radius:4px;font-size:0.78rem;font-weight:500;text-decoration:none;transition:opacity 0.2s}
.btn-whatsapp:hover{opacity:0.88}
.btn-whatsapp svg{width:15px;height:15px;fill:white;flex-shrink:0}

.article-hero{background:var(--bg-dark);padding:9rem 4rem 4rem;position:relative;overflow:hidden}
.article-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 30% 60%,rgba(45,106,79,0.25) 0%,transparent 60%);pointer-events:none}
.article-hero-inner{max-width:800px;margin:0 auto;position:relative}
.article-tag{font-size:0.65rem;letter-spacing:0.25em;text-transform:uppercase;color:var(--green-light);margin-bottom:1.25rem;display:flex;align-items:center;gap:0.75rem}
.article-tag::before{content:'';width:24px;height:1px;background:var(--green-light)}
.article-title{font-family:'Playfair Display',serif;font-size:clamp(2rem,4vw,3rem);color:white;line-height:1.15;margin-bottom:1.25rem}
.article-desc{font-size:1rem;color:rgba(255,255,255,0.55);line-height:1.7;max-width:640px}
.article-cover{width:100%;max-height:480px;object-fit:cover;display:block}

.article-body-wrap{max-width:760px;margin:4rem auto;padding:0 2rem 5rem}
.article-body{font-size:1rem;line-height:1.85;color:var(--text-mid)}
.article-body h1,.article-body h2,.article-body h3{font-family:'Playfair Display',serif;color:var(--text);margin:2rem 0 0.75rem}
.article-body h1{font-size:2rem}
.article-body h2{font-size:1.5rem}
.article-body h3{font-size:1.2rem}
.article-body p{margin-bottom:1.25rem}
.article-body ul,.article-body ol{margin:1rem 0 1.25rem 1.5rem}
.article-body li{margin-bottom:0.4rem}
.article-body strong{color:var(--text);font-weight:600}
.article-body em{font-style:italic}
.article-body a{color:var(--green);text-decoration:underline}
.article-body blockquote{border-left:3px solid var(--green-light);padding:1rem 1.5rem;margin:1.5rem 0;background:rgba(45,106,79,0.06);border-radius:0 6px 6px 0;font-style:italic;color:var(--text-mid)}
.article-body img{max-width:100%;border-radius:8px;margin:1.5rem 0}
.article-body hr{border:none;border-top:1px solid var(--border);margin:2rem 0}

.back-link{display:inline-flex;align-items:center;gap:0.5rem;font-size:0.78rem;color:var(--muted);text-decoration:none;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:2.5rem;transition:color 0.2s}
.back-link:hover{color:var(--green)}

.not-found{text-align:center;padding:5rem 2rem;color:var(--muted)}

footer{background:var(--bg-dark);padding:4rem;display:grid;grid-template-columns:1fr 1fr 1fr;gap:2rem;align-items:start}
.footer-logo{font-family:'Playfair Display',serif;font-size:1.4rem;color:white;letter-spacing:0.06em;margin-bottom:0.5rem}
.footer-tagline{font-size:0.75rem;color:rgba(255,255,255,0.4);letter-spacing:0.1em;text-transform:uppercase}
.footer-social{display:flex;gap:1.5rem;margin-top:1.25rem}
.footer-social a{font-size:0.78rem;color:rgba(255,255,255,0.5);text-decoration:none;text-transform:uppercase;letter-spacing:0.08em;transition:color 0.2s}
.footer-social a:hover{color:var(--green-light)}
.footer-links{display:flex;flex-direction:column;gap:0.75rem}
.footer-links a{font-size:0.8rem;color:rgba(255,255,255,0.5);text-decoration:none;text-transform:uppercase;letter-spacing:0.08em;transition:color 0.2s}
.footer-links a:hover{color:white}
.footer-right{text-align:right;font-size:0.8rem;color:rgba(255,255,255,0.4)}

@media(max-width:768px){
  nav{padding:1rem 1.5rem}
  .nav-links{display:none}
  .article-hero{padding:7rem 1.5rem 3rem}
  .article-body-wrap{padding:0 1.5rem 3rem;margin:2rem auto}
  footer{grid-template-columns:1fr;padding:2.5rem 1.5rem;gap:2rem}
  .footer-right{text-align:left}
}
</style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo display">LUCERA GLOBAL</a>
  <ul class="nav-links">
    <li><a href="/#how-it-works">How It Works</a></li>
    <li><a href="/#package">Packages</a></li>
    <li><a href="/blog">Journal</a></li>
    <li><a href="/#faq">FAQ</a></li>
  </ul>
  <a href="#" class="btn-whatsapp" id="waBtn">
    <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
    WhatsApp
  </a>
</nav>

<div id="article-hero" class="article-hero">
  <div class="article-hero-inner">
    <div class="loading-state" style="color:rgba(255,255,255,0.4)">Loading...</div>
  </div>
</div>

<div class="article-body-wrap">
  <a href="/blog" class="back-link">← Back to Journal</a>
  <div class="article-body" id="article-body"></div>
</div>

<footer>
  <div>
    <div class="footer-logo display">LUCERA GLOBAL</div>
    <div class="footer-tagline">VIP Hair Restoration · Worldwide to Istanbul</div>
    <div class="footer-social">
      <a href="#" id="igLink">Instagram</a>
      <a href="#" id="ttLink">TikTok</a>
    </div>
  </div>
  <div class="footer-links">
    <a href="/#how-it-works">How It Works</a>
    <a href="/#package">Packages</a>
    <a href="/blog">Journal</a>
    <a href="/#faq">FAQ</a>
  </div>
  <div class="footer-right">
    <div id="footerEmail">info@luceraglobal.com</div>
    <div style="margin-top:0.4rem">© 2025 Lucera Global</div>
  </div>
</footer>

<script>
function slugify(str) {
  return str.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
}

async function loadData(file) {
  try {
    const r = await fetch('/_data/' + file + '.json?v=' + Date.now());
    if (!r.ok) throw new Error();
    return await r.json();
  } catch(e) { return null; }
}

async function init() {
  const slug = location.pathname.replace('/blog/','').replace(/\/$/,'');
  const [settings, articles] = await Promise.all([loadData('settings'), loadData('articles')]);

  if (settings) {
    const waUrl = 'https://wa.me/' + (settings.whatsapp||'').replace(/\D/g,'');
    document.getElementById('waBtn').href = waUrl;
    if (settings.instagram) document.getElementById('igLink').href = settings.instagram;
    if (settings.tiktok) document.getElementById('ttLink').href = settings.tiktok;
    if (settings.email) document.getElementById('footerEmail').textContent = settings.email;
  }

  const list = Array.isArray(articles) ? articles : (articles?.articles || []);
  const article = list.find(a => slugify(a.title || '') === slug);

  const hero = document.getElementById('article-hero');
  const body = document.getElementById('article-body');

  if (!article) {
    hero.innerHTML = '<div class="article-hero-inner"><div style="color:rgba(255,255,255,0.5)">Article not found.</div></div>';
    body.innerHTML = '<div class="not-found"><a href="/blog" style="color:var(--green)">← Back to Journal</a></div>';
    return;
  }

  document.title = (article.title || 'Article') + ' — Lucera Global';

  hero.innerHTML = `
    <div class="article-hero-inner">
      <div class="article-tag">${article.tag || ''}</div>
      <h1 class="article-title display">${article.title || ''}</h1>
      <p class="article-desc">${article.desc || ''}</p>
    </div>
  `;

  if (article.image) {
    hero.insertAdjacentHTML('afterend', `<img src="${article.image}" class="article-cover" alt="">`);
  }

  body.innerHTML = article.body || '<p style="color:var(--muted)">No content yet.</p>';
}

init();
</script>
</body>
</html>
